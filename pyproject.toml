[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = "lysis"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]

[tool.pytest.ini_options]
pythonpath = ["src"]