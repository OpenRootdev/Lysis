name: Refresh data and model
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
      LYSIS_MAX_WAIT: "3700"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: lysis-data-${{ github.run_id }}
          restore-keys: lysis-data-
      - run: python src/lysis/ingestion/fetch.py
      - run: python src/lysis/features/labels.py
      - run: python src/lysis/models/train.py
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: lysis-data-${{ github.run_id }}